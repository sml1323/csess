[package]
name = "csess"
version = "0.2.0"
edition = "2021"
description = "Claude/Codex 세션 본문 검색 + resume 런처 (Phase B — Rust TUI)"
license = "MIT"
default-run = "csess"

[[bin]]
name = "csess"
path = "src/main.rs"

# Phase B 데이터 레이어(step 1–2). index/search/tui/codex 의존성은 해당 단계에서 추가.
[dependencies]
serde_json = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.30.0"
unicode-width = "0.2" # CJK 표시폭 — IME 커서 위치 · 리스트 truncation · 프리뷰 word-wrap
unicode-segmentation = "1" # 프리뷰 word-wrap 의 grapheme 단위 분할 (ZWJ/VS16 이모지 클러스터 보존)

[profile.release]
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
